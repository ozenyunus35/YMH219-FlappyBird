name: Derleme ve Testler

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: .NET kurulumu
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Paketleri geri yükle
        run: dotnet restore YMH219-FlappyBird.sln

      - name: Derle
        run: dotnet build YMH219-FlappyBird.sln --no-restore -c Release

      - name: Testleri çalıştır
        run: dotnet test YMH219-FlappyBird.sln --no-build -c Release --verbosity normal
